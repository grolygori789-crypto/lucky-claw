<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f8e9df">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Lucky Claw — a premium claw-machine game by Benedict Interactive.">
  <title>Lucky Claw</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lucky Claw">
  <link rel="preload" as="image" href="./assets/machines/classic/cabinet-base.webp" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/plushies/title/title-plush-layer.png?v=001.15">
  <link rel="preload" as="image" href="./assets/machines/classic/title-claw-rail.png?v=001.15">
  <link rel="stylesheet" href="./src/css/app.css?v=001.15">
  <link rel="stylesheet" href="./src/css/title-showcase.css?v=001.15">
  <script type="module" src="./src/js/core/app.js?v=001.15"></script>
</head>
<body data-build="001.15" data-screen="splash">
  <main class="app-shell" id="app" aria-live="polite">
    <div class="cabinet-stage" aria-hidden="true">
      <img
        class="cabinet-stage__image"
        src="./assets/machines/classic/cabinet-base.webp"
        width="841"
        height="1870"
        alt=""
        decoding="async"
        fetchpriority="high"
      >

      <div class="cabinet-stage__warmth"></div>

      <div class="cabinet-title-plush" data-title-plush>
        <img
          class="cabinet-title-plush__image"
          src="./assets/plushies/title/title-plush-layer.png?v=001.15"
          width="841"
          height="932"
          alt=""
          decoding="async"
        >
      </div>

      <div class="cabinet-title-claw" data-title-claw>
        <img
          class="cabinet-title-claw__image"
          src="./assets/machines/classic/title-claw-rail.png?v=001.15"
          width="1122"
          height="614"
          alt=""
          decoding="async"
        >
      </div>

      <div class="cabinet-stage__glass"></div>
      <div class="cabinet-stage__glass-sheen"></div>

      <div class="cabinet-controls" data-cabinet-controls>
        <div class="cabinet-joystick">
          <div class="cabinet-joystick__base"></div>
          <div class="cabinet-joystick__stem"></div>
          <div class="cabinet-joystick__knob"></div>
        </div>

        <div class="cabinet-monitor">
          <div class="cabinet-monitor__screen">
            <span class="cabinet-monitor__status" data-i18n="controls.ready">READY</span>
          </div>
        </div>

        <div class="cabinet-button cabinet-button--shuffle">
          <span class="cabinet-button__icon">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7 7h2.2c4.4 0 5.3 10 9.8 10H21" stroke="currentColor" stroke-width="2.15" stroke-linecap="round"/>
              <path d="m18.2 14.3 2.8 2.7-2.8 2.7" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7 17h2.2c1.4 0 2.5-1 3.5-2.5M15.2 9.8C16.3 8.1 17.4 7 19 7h2" stroke="currentColor" stroke-width="2.15" stroke-linecap="round"/>
              <path d="m18.2 4.3 2.8 2.7-2.8 2.7" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>

        <div class="cabinet-button cabinet-button--drop">
          <span class="cabinet-button__icon">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 4v12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              <path d="m7.3 12.3 4.7 4.8 4.7-4.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M6 20h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="cabinet-stage__shine"></div>
      <div class="cabinet-stage__sparkles">
        <i></i><i></i><i></i><i></i><i></i>
      </div>
    </div>

    <section class="screen screen--splash is-active" data-screen="splash" aria-label="Benedict Games intro">
      <div class="splash-brand" data-splash-brand>
        <div class="splash-brand__star" aria-hidden="true">✦</div>
        <div class="splash-brand__name">BENEDICT GAMES</div>
        <div class="splash-brand__parent">by Benedict Interactive</div>
      </div>
    </section>

    <section class="screen screen--language" data-screen="language" aria-labelledby="language-title" aria-hidden="true">
      <div class="glass-card language-card">
        <div class="mini-brand" aria-hidden="true">LUCKY CLAW</div>
        <h1 id="language-title" data-i18n="language.title">Choose your language</h1>
        <p data-i18n="language.subtitle">You can change this anytime.</p>

        <div class="language-options" role="group" aria-labelledby="language-title">
          <button class="choice-button" type="button" data-language="th">
            <span class="choice-button__primary">ไทย</span>
            <span class="choice-button__secondary">TH</span>
          </button>
          <button class="choice-button" type="button" data-language="en">
            <span class="choice-button__primary">English</span>
            <span class="choice-button__secondary">EN</span>
          </button>
        </div>
      </div>
    </section>

    <section class="screen screen--title" data-screen="title" aria-labelledby="game-title" aria-hidden="true">
      <div class="title-lockup">
        <div class="title-lockup__eyebrow" data-i18n="title.eyebrow">Benedict Games presents</div>
        <h1 class="game-logo" id="game-title">
          <span class="game-logo__lucky">LUCKY</span>
          <span class="game-logo__claw">CLAW</span>
        </h1>
        <div class="title-lockup__ornament" aria-hidden="true"><span></span>✦<span></span></div>
        <p class="title-lockup__tagline" data-i18n="title.tagline">Pick your favorite. Make it yours.</p>
      </div>

      <button class="language-chip" type="button" data-open-language aria-label="Change language">
        <span aria-hidden="true">A/ก</span>
        <span data-language-code>EN</span>
      </button>
    </section>
  </main>

  <aside class="rotate-overlay" aria-hidden="true">
    <div class="rotate-overlay__phone" aria-hidden="true"></div>
    <strong data-i18n="rotate.title">Best in portrait</strong>
    <span data-i18n="rotate.body">Turn your phone upright to play.</span>
  </aside>

  <noscript>
    <div class="noscript">Lucky Claw needs JavaScript enabled to run.</div>
  </noscript>
</body>
</html>
